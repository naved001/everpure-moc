apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: storage-network
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "eno2",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.8.0.0/24", # in our case, the route to the management endpoint is on the storage network
        "range_start": "10.8.0.13",
        "range_end": "10.8.0.19",
        "gateway": "10.8.0.1",
        "routes": [
          {
            "dst": "10.3.11.50/32",
            "gw": "10.8.0.1"
          }
        ]
      }
    }'
